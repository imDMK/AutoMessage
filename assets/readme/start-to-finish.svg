<svg width="1320" height="336" viewBox="0 0 1320 336" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sfTitle sfDesc">
  <title id="sfTitle">What the two configuration files above actually do</title>
  <desc id="sfDesc">Two players join the same server. Three seconds later the veteran with 240 hours played passes the playtime rule and receives the chat greeting with a level-up sound. The newcomer with twelve minutes played fails the rule and receives nothing at all.</desc>
  <defs>
    <pattern id="sfGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#A8B2D1" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="sfClip"><rect width="1320" height="336" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#sfClip)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <rect width="1320" height="336" fill="#0A0F1E"/>
    <rect width="1320" height="336" fill="url(#sfGrid)"/>
    <text x="48" y="46" fill="#8593B4" font-size="14" letter-spacing="1.6">TWO PLAYERS JOIN THE SAME SERVER</text>
    <rect x="32" y="70" width="1256" height="116" rx="14" fill="#16223C" stroke="#45D7E8" stroke-opacity="0.40"/>
    <rect x="56" y="98" width="216" height="60" rx="10" fill="#0A0F1E" stroke="#2E3A5C"/>
    <circle cx="88" cy="128" r="13" fill="#45D7E8" fill-opacity="0.30"/>
    <text x="112" y="123" fill="#C6CEE6" font-size="14">Kasia</text>
    <text x="112" y="142" fill="#5D6884" font-size="12">240 hours played</text>
    <path d="M282 128h56" stroke="#414D6B" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M334 124l6 4-6 4z" fill="#414D6B"/>
    <text x="310" y="114" fill="#8593B4" font-size="12" text-anchor="middle">3s</text>
    <rect x="352" y="98" width="196" height="60" rx="10" fill="#0A0F1E" stroke="#2E3A5C"/>
    <text x="450" y="123" fill="#8593B4" font-size="12" text-anchor="middle">PLAYTIME min 10h</text>
    <text x="450" y="142" fill="#45D7E8" font-size="13" text-anchor="middle">passes</text>
    <path d="M558 128h34" stroke="#414D6B" stroke-width="1.5"/><path d="M588 124l6 4-6 4z" fill="#414D6B"/>
    <rect x="606" y="92" width="658" height="72" rx="10" fill="#0A0F1E" stroke="#45D7E8" stroke-opacity="0.40"/>
    <text x="630" y="123" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan fill="#A8B2D1">Welcome back, </tspan><tspan fill="#45D7E8">Kasia</tspan><tspan fill="#A8B2D1">.</tspan></text>
    <rect x="630" y="132" width="188" height="22" rx="11" fill="#0F2233" stroke="#45D7E8" stroke-opacity="0.4"/>
    <text x="642" y="148" fill="#45D7E8" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">entity.player.levelup</text>
    <rect x="32" y="198" width="1256" height="116" rx="14" fill="#16223C" stroke="#2E3A5C" stroke-opacity="1"/>
    <rect x="56" y="226" width="216" height="60" rx="10" fill="#0A0F1E" stroke="#2E3A5C"/>
    <circle cx="88" cy="256" r="13" fill="#414D6B" fill-opacity="0.30"/>
    <text x="112" y="251" fill="#5D6884" font-size="14">Tomek</text>
    <text x="112" y="270" fill="#5D6884" font-size="12">12 minutes played</text>
    <path d="M282 256h56" stroke="#414D6B" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M334 252l6 4-6 4z" fill="#414D6B"/>
    <text x="310" y="242" fill="#8593B4" font-size="12" text-anchor="middle">3s</text>
    <rect x="352" y="226" width="196" height="60" rx="10" fill="#0A0F1E" stroke="#2E3A5C"/>
    <text x="450" y="251" fill="#8593B4" font-size="12" text-anchor="middle">PLAYTIME min 10h</text>
    <text x="450" y="270" fill="#7C89A8" font-size="13" text-anchor="middle">does not pass</text>
    <path d="M558 256h34" stroke="#414D6B" stroke-width="1.5"/><path d="M588 252l6 4-6 4z" fill="#414D6B"/>
    <rect x="606" y="220" width="658" height="72" rx="10" fill="#0A0F1E" stroke="#2E3A5C" stroke-opacity="1"/>
    <text x="630" y="261" fill="#5D6884" font-size="14">Nothing at all - and no line in chat to wonder about.</text>
    <text x="48" y="322" fill="#5D6884" font-size="12">No timer fired. The greeting exists only as a reaction to joining, and only for the half of the room the rule selected.</text>
  </g>
</svg>
