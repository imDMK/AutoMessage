<svg width="1320" height="500" viewBox="0 0 1320 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cfgTitle cfgDesc">
  <title id="cfgTitle">The same plugin writes a different file on each platform</title>
  <desc id="cfgDesc">Two generated configuration files side by side. On Paper every option is written. On a Velocity proxy the world rule, the playtime rule, the first-join trigger, the world placeholder, the PlaceholderAPI note and the playtime example are absent, because the runtime cannot honour them.</desc>
  <defs>
    <pattern id="cfgGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#A8B2D1" stroke-opacity="0.04"/></pattern>
    <clipPath id="cfgClip"><rect width="1320" height="500" rx="16"/></clipPath>
  </defs>
