<svg width="1320" height="300" viewBox="0 0 1320 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pfTitle pfDesc">
  <title id="pfTitle">One core, six runtimes</title>
  <desc id="pfDesc">A single platform-neutral core connected to six platform artifacts: Bukkit, Folia, Sponge, Velocity, Fabric and Minestom, each with the Minecraft line it targets.</desc>
