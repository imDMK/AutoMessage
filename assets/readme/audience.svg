<svg width="1320" height="420" viewBox="0 0 1320 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="audTitle audDesc">
  <title id="audTitle">Audience rules, applied to a live roster</title>
  <desc id="audDesc">Twelve players online. A rule requiring the rank.vip permission and at least ten hours of playtime selects 5 of them; the rest are dimmed and receive nothing.</desc>
  <defs>
    <linearGradient id="matchFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/><stop offset="1" stop-color="#45D7E8"/>
    </linearGradient>
    <linearGradient id="matchRing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#7FE7F3"/>
    </linearGradient>
    <pattern id="audGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#A8B2D1" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="audClip"><rect width="1320" height="420" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#audClip)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <rect width="1320" height="420" fill="#0A0F1E"/>
    <rect width="1320" height="420" fill="url(#audGrid)"/>

    <text x="48" y="52" fill="#8593B4" font-size="14" letter-spacing="1.6">THE RULE</text>
    <rect x="48" y="74" width="330" height="232" rx="16" fill="#101932" stroke="#2E3A5C" stroke-width="1.5"/>
    <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15.5">
      <text x="74" y="116" fill="#7C89A8">rules:</text>
      <text x="74" y="146" fill="#A78BFA">  - type: <tspan fill="#E8ECFB">PERMISSION</tspan></text>
      <text x="74" y="172" fill="#7C89A8">    permission: <tspan fill="#F7C65B">rank.vip</tspan></text>
      <text x="74" y="208" fill="#A78BFA">  - type: <tspan fill="#E8ECFB">PLAYTIME</tspan></text>
      <text x="74" y="234" fill="#7C89A8">    min: <tspan fill="#F7C65B">10h</tspan></text>
    </g>
    <text x="74" y="274" fill="#5D6884" font-size="13.5">every rule must pass</text>

    <text x="438" y="52" fill="#8593B4" font-size="14" letter-spacing="1.6">12 PLAYERS ONLINE</text>
  <g opacity="1">
    <circle cx="511" cy="136" r="27" fill="url(#matchFill)" stroke="url(#matchRing)" stroke-width="2.5"/>
    <text x="511" y="143" fill="#0A0F1E" font-size="20" font-weight="700" text-anchor="middle">S</text>
    <text x="511" y="186" fill="#C6CEE6" font-size="14" text-anchor="middle">Steve</text>
    <text x="511" y="206" fill="#F7C65B" font-size="12.5" text-anchor="middle">VIP · 42h</text>
  </g>
  <g opacity="0.30">
    <circle cx="657" cy="136" r="27" fill="#131C33" stroke="#2B3552" stroke-width="2.5"/>
    <text x="657" y="143" fill="#8593B4" font-size="20" font-weight="700" text-anchor="middle">A</text>
    <text x="657" y="186" fill="#C6CEE6" font-size="14" text-anchor="middle">Alex</text>
    <text x="657" y="206" fill="#F7C65B" font-size="12.5" text-anchor="middle">VIP · 3h</text>
  </g>
  <g opacity="0.30">
    <circle cx="803" cy="136" r="27" fill="#131C33" stroke="#2B3552" stroke-width="2.5"/>
    <text x="803" y="143" fill="#8593B4" font-size="20" font-weight="700" text-anchor="middle">K</text>
    <text x="803" y="186" fill="#C6CEE6" font-size="14" text-anchor="middle">Kuba</text>
    <text x="803" y="206" fill="#5D6884" font-size="12.5" text-anchor="middle">61h</text>
  </g>
  <g opacity="1">
    <circle cx="949" cy="136" r="27" fill="url(#matchFill)" stroke="url(#matchRing)" stroke-width="2.5"/>
    <text x="949" y="143" fill="#0A0F1E" font-size="20" font-weight="700" text-anchor="middle">M</text>
    <text x="949" y="186" fill="#C6CEE6" font-size="14" text-anchor="middle">Mira</text>
    <text x="949" y="206" fill="#F7C65B" font-size="12.5" text-anchor="middle">VIP · 18h</text>
  </g>
  <g opacity="0.30">
    <circle cx="1095" cy="136" r="27" fill="#131C33" stroke="#2B3552" stroke-width="2.5"/>
    <text x="1095" y="143" fill="#8593B4" font-size="20" font-weight="700" text-anchor="middle">R</text>
    <text x="1095" y="186" fill="#C6CEE6" font-size="14" text-anchor="middle">Ren</text>
    <text x="1095" y="206" fill="#5D6884" font-size="12.5" text-anchor="middle">9h</text>
  </g>
  <g opacity="1">
    <circle cx="1241" cy="136" r="27" fill="url(#matchFill)" stroke="url(#matchRing)" stroke-width="2.5"/>
    <text x="1241" y="143" fill="#0A0F1E" font-size="20" font-weight="700" text-anchor="middle">N</text>
    <text x="1241" y="186" fill="#C6CEE6" font-size="14" text-anchor="middle">Nova</text>
    <text x="1241" y="206" fill="#F7C65B" font-size="12.5" text-anchor="middle">VIP · 27h</text>
  </g>
  <g opacity="0.30">
    <circle cx="511" cy="268" r="27" fill="#131C33" stroke="#2B3552" stroke-width="2.5"/>
    <text x="511" y="275" fill="#8593B4" font-size="20" font-weight="700" text-anchor="middle">I</text>
    <text x="511" y="318" fill="#C6CEE6" font-size="14" text-anchor="middle">Iris</text>
    <text x="511" y="338" fill="#5D6884" font-size="12.5" text-anchor="middle">2h</text>
  </g>
  <g opacity="1">
    <circle cx="657" cy="268" r="27" fill="url(#matchFill)" stroke="url(#matchRing)" stroke-width="2.5"/>
    <text x="657" y="275" fill="#0A0F1E" font-size="20" font-weight="700" text-anchor="middle">O</text>
    <text x="657" y="318" fill="#C6CEE6" font-size="14" text-anchor="middle">Otto</text>
    <text x="657" y="338" fill="#F7C65B" font-size="12.5" text-anchor="middle">VIP · 55h</text>
  </g>
  <g opacity="0.30">
    <circle cx="803" cy="268" r="27" fill="#131C33" stroke="#2B3552" stroke-width="2.5"/>
    <text x="803" y="275" fill="#8593B4" font-size="20" font-weight="700" text-anchor="middle">P</text>
    <text x="803" y="318" fill="#C6CEE6" font-size="14" text-anchor="middle">Pax</text>
    <text x="803" y="338" fill="#5D6884" font-size="12.5" text-anchor="middle">12h</text>
  </g>
  <g opacity="1">
    <circle cx="949" cy="268" r="27" fill="url(#matchFill)" stroke="url(#matchRing)" stroke-width="2.5"/>
    <text x="949" y="275" fill="#0A0F1E" font-size="20" font-weight="700" text-anchor="middle">Y</text>
    <text x="949" y="318" fill="#C6CEE6" font-size="14" text-anchor="middle">Yuki</text>
    <text x="949" y="338" fill="#F7C65B" font-size="12.5" text-anchor="middle">VIP · 34h</text>
  </g>
  <g opacity="0.30">
    <circle cx="1095" cy="268" r="27" fill="#131C33" stroke="#2B3552" stroke-width="2.5"/>
    <text x="1095" y="275" fill="#8593B4" font-size="20" font-weight="700" text-anchor="middle">Z</text>
    <text x="1095" y="318" fill="#C6CEE6" font-size="14" text-anchor="middle">Zed</text>
    <text x="1095" y="338" fill="#F7C65B" font-size="12.5" text-anchor="middle">VIP · 7h</text>
  </g>
  <g opacity="0.30">
    <circle cx="1241" cy="268" r="27" fill="#131C33" stroke="#2B3552" stroke-width="2.5"/>
    <text x="1241" y="275" fill="#8593B4" font-size="20" font-weight="700" text-anchor="middle">E</text>
    <text x="1241" y="318" fill="#C6CEE6" font-size="14" text-anchor="middle">Elle</text>
    <text x="1241" y="338" fill="#5D6884" font-size="12.5" text-anchor="middle">21h</text>
  </g>

    <text x="438" y="384" font-size="17">
      <tspan fill="#45D7E8" font-weight="700">5 of 12</tspan><tspan fill="#8593B4"> receive this announcement. The other 7 never see it.</tspan>
    </text>
    <rect x="0.75" y="0.75" width="1318.5" height="418.5" rx="15.5" fill="none" stroke="#A8B2D1" stroke-opacity="0.11"/>
  </g>
</svg>
