# Fabric Loom decompiles and remaps the whole of Minecraft during configuration, and does it in
# the Gradle process. Gradle's default heap is not enough for that: the build dies with
# "Java heap space" while evaluating the Fabric module, and thrashes the garbage collector for a
# long while before it does. Nothing else in this build needs the room.
org.gradle.jvmargs=-Xmx4G
